<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="./" />
    <title>Self Inspect</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #fff;
        --bg-secondary: #f5f5f5;
        --bg-hover: #f0f0f0;
        --border: #e0e0e0;
        --text: #111;
        --text-muted: #666;
        --text-faint: #aaa;
        --primary: #6366f1;
        --badge-bg: #f0f0f0;
        --badge-text: #444;
        --danger: #ef4444;
        --success: #22c55e;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --bg-secondary: #222;
          --bg-hover: #2a2a2a;
          --border: #333;
          --text: #e8e8e8;
          --text-muted: #999;
          --text-faint: #555;
          --badge-bg: #2a2a2a;
          --badge-text: #ccc;
        }
      }
      body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
      #app { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
